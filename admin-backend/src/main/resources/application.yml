spring:
  config:
    import: optional:file:.env[.properties], optional:file:admin-backend/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: admin-backend

  datasource:
    url: ${AWS_DB_URL}
    username: ${AWS_DB_USERNAME}
    password: ${AWS_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: ${AWS_JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${AWS_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: true

server:
  port: 8081

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-must-be-at-least-32-bytes}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

app:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET}
      upload-path: ${S3_UPLOAD_PATH:uploads}

logging:
  level:
    root: info
    org.springframework.security: info
    org.hibernate.SQL: debug
