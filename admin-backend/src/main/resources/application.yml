spring:
  application:
    name: admin-backend

  datasource:
    url: jdbc:oracle:thin:@//127.0.0.1:1521/XEPDB1
    username: KYUNG_USER
    password: kyung_password
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: true

server:
  port: 8081

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: your-jwt-secret-key-must-be-at-least-32-bytes
  access-expiration-ms: 3600000
  refresh-expiration-ms: 1209600000

logging:
  level:
    root: info
    org.springframework.security: info
    org.hibernate.SQL: debug
